<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f5f5f5;
        }
        
        .result.show {
            display: block;
        }
        
        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .result-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .result-label {
            font-weight: 600;
            color: #666;
            font-size: 13px;
        }
        
        .result-value {
            font-size: 18px;
            color: #333;
            margin-top: 5px;
        }
        
        .risk-high {
            color: #e74c3c;
        }
        
        .risk-medium {
            color: #f39c12;
        }
        
        .risk-low {
            color: #27ae60;
        }
        
        .error {
            display: none;
            padding: 15px;
            background-color: #ffe0e0;
            color: #c0392b;
            border-left: 4px solid #c0392b;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Customer Churn Prediction</h1>
        <p class="subtitle">Machine Learning API for customer churn prediction</p>
        
        <div class="error" id="error"></div>
        
        <form id="predictionForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="feature0">Feature 0</label>
                    <input type="number" id="feature0" name="feature0" value="100" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="feature1">Feature 1</label>
                    <input type="number" id="feature1" name="feature1" value="50" step="0.1" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="feature2">Feature 2</label>
                    <input type="number" id="feature2" name="feature2" value="25" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="feature3">Feature 3</label>
                    <input type="number" id="feature3" name="feature3" value="10" step="0.1" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="feature4">Feature 4</label>
                    <input type="number" id="feature4" name="feature4" value="5" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="feature5">Feature 5</label>
                    <input type="number" id="feature5" name="feature5" value="8" step="0.1" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="feature6">Feature 6</label>
                    <input type="number" id="feature6" name="feature6" value="12" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="feature7">Feature 7</label>
                    <input type="number" id="feature7" name="feature7" value="3" step="0.1" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="feature8">Feature 8</label>
                    <input type="number" id="feature8" name="feature8" value="6" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="feature9">Feature 9</label>
                    <input type="number" id="feature9" name="feature9" value="4" step="0.1" required>
                </div>
            </div>
            
            <button type="submit">Predict Churn</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing prediction...</p>
        </div>
        
        <div class="result" id="result">
            <h3>📊 Prediction Results</h3>
            
            <div class="result-item">
                <div class="result-label">Churn Prediction</div>
                <div class="result-value" id="predictionResult"></div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Churn Probability</div>
                <div class="result-value" id="probabilityResult"></div>
            </div>
            
            <div class="result-item">
                <div class="result-label">Risk Level</div>
                <div class="result-value" id="riskResult"></div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('predictionForm');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Gather form data
            const formData = new FormData(form);
            const data = {
                feature0: parseFloat(formData.get('feature0')),
                feature1: parseFloat(formData.get('feature1')),
                feature2: parseFloat(formData.get('feature2')),
                feature3: parseFloat(formData.get('feature3')),
                feature4: parseFloat(formData.get('feature4')),
                feature5: parseFloat(formData.get('feature5')),
                feature6: parseFloat(formData.get('feature6')),
                feature7: parseFloat(formData.get('feature7')),
                feature8: parseFloat(formData.get('feature8')),
                feature9: parseFloat(formData.get('feature9'))
            };
            
            // Show loading, hide results
            loading.style.display = 'block';
            result.classList.remove('show');
            error.classList.remove('show');
            
            try {
                // Send POST request to API
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result_data = await response.json();
                
                // Display results
                loading.style.display = 'none';
                
                const predictionText = result_data.prediction === 1 ? '✓ Will Churn' : '✗ Won\'t Churn';
                const probabilityText = (result_data.churn_probability * 100).toFixed(2) + '%';
                
                let riskClass = '';
                if (result_data.risk_level === 'High Risk') {
                    riskClass = 'risk-high';
                } else if (result_data.risk_level === 'Medium Risk') {
                    riskClass = 'risk-medium';
                } else {
                    riskClass = 'risk-low';
                }
                
                document.getElementById('predictionResult').textContent = predictionText;
                document.getElementById('probabilityResult').textContent = probabilityText;
                document.getElementById('riskResult').innerHTML = 
                    `<span class="${riskClass}">${result_data.risk_level}</span>`;
                
                result.classList.add('show');
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '❌ Error: ' + err.message;
                error.classList.add('show');
            }
        });
    </script>
</body>
</html>
